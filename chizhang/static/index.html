<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<title>吃账 — 减脂饮食记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e2662b'/%3E%3Cpath d='M10 16h12M16 10v12' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <span>吃账</span>
  </div>

  <div class="datebar">
    <button class="icon-btn" id="prevDay" aria-label="前一天">‹</button>
    <button class="datelabel" id="todayBtn" title="回到今天">
      <strong id="dayText">今天</strong>
      <small id="daySub">—</small>
    </button>
    <button class="icon-btn" id="nextDay" aria-label="后一天">›</button>
  </div>

  <div class="topactions">
    <button class="ghost" id="settingsBtn">目标设置</button>
  </div>
</header>

<main class="layout">
  <section class="col-main">

    <div class="card summary">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="52"></circle>
          <circle class="bar" id="ringBar" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"></circle>
        </svg>
        <div class="ring-center">
          <strong id="remainKcal">—</strong>
          <small id="remainLabel">还能吃 kcal</small>
        </div>
      </div>

      <div class="summary-side">
        <div class="summary-head">
          <div>
            <span class="summary-label">已摄入</span>
            <strong id="eatenKcal">0</strong>
            <span class="summary-target">/ <span id="targetKcal">—</span> kcal</span>
          </div>
          <div class="deficit-note" id="deficitNote"></div>
        </div>

        <div class="macros" id="macros"></div>
      </div>
    </div>

    <div class="insight-card" id="insightCard" hidden></div>

    <div class="meals" id="meals"></div>
  </section>

  <aside class="col-side">
    <div class="card" id="weekCard"></div>
    <div class="card" id="weightCard"></div>
    <div class="card discipline" id="disciplineCard"></div>
  </aside>
</main>

<!-- 添加食物的面板 -->
<div class="sheet" id="searchSheet" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="sheetTitle">添加食物</h2>
      <button class="icon-btn" id="closeSheet" aria-label="关闭">×</button>
    </div>

    <div class="sheet-body">
      <div class="search-row">
        <input type="search" id="foodQuery" placeholder="搜索食物，比如 米饭、鸡蛋、奶茶" autocomplete="off">
      </div>
      <div class="recent-row" id="recentRow" hidden>
        <span class="recent-label">常吃</span>
        <div class="chips" id="recentChips"></div>
      </div>
      <div class="chips" id="catChips"></div>
      <div class="results" id="results"></div>

      <button class="link-btn" id="customToggle">没找到？手动记一笔</button>
      <div class="custom-form" id="customForm" hidden>
        <div class="field-grid">
          <label>名称<input id="cName" placeholder="比如 妈妈做的红烧肉"></label>
          <label>热量 kcal<input id="cKcal" type="number" inputmode="decimal" placeholder="350"></label>
          <label>蛋白质 g<input id="cProtein" type="number" inputmode="decimal" placeholder="12"></label>
          <label>碳水 g<input id="cCarb" type="number" inputmode="decimal" placeholder="20"></label>
          <label>脂肪 g<input id="cFat" type="number" inputmode="decimal" placeholder="18"></label>
          <label>份量 g<input id="cGrams" type="number" inputmode="decimal" value="100"></label>
        </div>
        <button class="primary" id="customSave">加入这一餐</button>
      </div>
    </div>
  </div>
</div>

<!-- 份量选择 -->
<div class="sheet" id="portionSheet" hidden>
  <div class="sheet-panel narrow">
    <div class="sheet-head">
      <h2 id="portionTitle">选份量</h2>
      <button class="icon-btn" id="closePortion" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body">
      <p class="portion-meta" id="portionMeta"></p>
      <div class="portion-chips" id="portionChips"></div>
      <div class="grams-row">
        <label for="gramsInput">或输入克数</label>
        <div class="grams-input">
          <input type="number" id="gramsInput" inputmode="decimal" value="100" min="1" max="5000">
          <span>g</span>
        </div>
      </div>
      <div class="preview" id="portionPreview"></div>
      <button class="primary wide" id="confirmPortion">加入这一餐</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="sheet" id="settingsSheet" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2>目标设置</h2>
      <button class="icon-btn" id="closeSettings" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body">
      <p class="hint">按 Mifflin-St Jeor 公式算出基础代谢，再乘活动系数得到每日消耗，减掉缺口就是你的目标。改完立刻生效。</p>

      <div class="seg" id="sexSeg">
        <button data-value="female">女性</button>
        <button data-value="male">男性</button>
      </div>

      <div class="field-grid">
        <label>年龄<input id="pAge" type="number" inputmode="numeric" min="14" max="100"></label>
        <label>身高 cm<input id="pHeight" type="number" inputmode="decimal" step="0.1"></label>
        <label>体重 kg<input id="pWeight" type="number" inputmode="decimal" step="0.1"></label>
        <label>每天缺口 kcal<input id="pDeficit" type="number" inputmode="numeric" step="50" min="0" max="1000"></label>
      </div>

      <label class="block-label">活动量</label>
      <div class="radio-list" id="activityList"></div>

      <label class="block-label">目标</label>
      <div class="radio-list" id="goalList"></div>

      <div class="calc-preview" id="calcPreview"></div>

      <button class="primary wide" id="saveProfile">保存</button>

      <div class="danger-zone">
        <button class="link-btn" id="exportBtn">导出备份（JSON）</button>
        <button class="link-btn danger" id="clearDayBtn">清空这一天</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/assets/app.js"></script>
</body>
</html>
