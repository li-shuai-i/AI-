[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chizhang"
version = "0.1.0"
description = "本地优先的减脂饮食记录工具 —— 记录吃了什么，算出热量和蛋白质，数据不上传"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Li Shuai" }]
keywords = ["diet", "nutrition", "calorie", "weight-loss", "local-first", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/li-shuai-i/chizhang"
Source = "https://github.com/li-shuai-i/chizhang"
Issues = "https://github.com/li-shuai-i/chizhang/issues"

[project.scripts]
chizhang = "chizhang.cli:main"

[tool.setuptools]
packages = ["chizhang"]

[tool.setuptools.package-data]
chizhang = ["static/*"]
